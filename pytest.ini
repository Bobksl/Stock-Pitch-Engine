[pytest]
# Collect only tests/. `scripts/` holds operator tools, and one of them --
# scripts/test_llm.py, a manual live-API smoke check -- matches pytest's default
# `test_*.py` glob. Collecting it imported the OpenAI client for no test, and in
# CI (which does not install `openai`) it failed collection outright.
testpaths = tests

# Run from the repo root as `python -m pytest`, so that `src` resolves. tests/
# conftest.py says the same; this makes the rootdir explicit rather than inferred.
