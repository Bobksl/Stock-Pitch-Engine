# ============================================================================
# P1.4 / Audit R7 — the labelled retrieval question set.
#
# Gold labels are LOCATIONS, not chunk ids: (ticker, fiscal_year, section_key),
# optionally narrowed by a pattern the chunk must contain. A chunk id would be
# invalidated by any change to chunk size, overlap or the segmenter — exactly
# the changes this set exists to evaluate — so a chunk-keyed gold set silently
# rots the first time the chunker is tuned. An Item is stable and a human can
# check it.
#
# `gold` may list several locations when an answer legitimately lives in more
# than one Item (segment economics appear in both the business description and
# the MD&A). A question is a hit when any gold location is retrieved.
#
# `ticker` / `year` are RETRIEVAL FILTERS, not labels. Most questions are left
# unfiltered on purpose: searching the whole corpus is the realistic setting and
# it is the only one that exposes cross-entity ranking problems (Audit R4).
#
# Every label below was checked against the retrieved text, not assumed.
# ============================================================================
